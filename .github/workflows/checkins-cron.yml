name: Treatment check-ins (cron)

# Davolanish kuzatuvi so'rovlarini yuboradi (supabase/functions/dispatch-checkins).
# Dori eslatmalari bilan bir xil secret'lardan foydalanadi: REMINDERS_FUNCTION_URL va REMINDERS_CRON_SECRET.
# URL oxiridagi "dispatch-reminders" o'rniga "dispatch-checkins" qo'yiladi.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkins-cron
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call dispatch-checkins
        env:
          REMINDERS_URL: ${{ secrets.REMINDERS_FUNCTION_URL }}
          SECRET: ${{ secrets.REMINDERS_CRON_SECRET }}
        run: |
          if [ -z "$REMINDERS_URL" ] || [ -z "$SECRET" ]; then
            echo "Secret'lar qo'shilmagan — o'tkazib yuborildi."
            exit 0
          fi
          URL="${REMINDERS_URL/dispatch-reminders/dispatch-checkins}"
          curl -sS --fail-with-body --max-time 60 -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $SECRET" \
            -d '{}'

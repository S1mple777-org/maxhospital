name: Medication reminders (fallback cron)

# Zaxira variant: agar bazada pg_cron ishlamasa, dori eslatmalarini shu workflow
# har 5 daqiqada yuboradi. GitHub jadvali ba'zan bir necha daqiqa kechikadi —
# shuning uchun asosiy usul pg_cron (MEDICATIONS.md).
# Ishlashi uchun repo secret'lari: REMINDERS_FUNCTION_URL, REMINDERS_CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminders-cron
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call dispatch-reminders
        env:
          URL: ${{ secrets.REMINDERS_FUNCTION_URL }}
          SECRET: ${{ secrets.REMINDERS_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "Secret'lar qo'shilmagan — o'tkazib yuborildi."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 60 -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $SECRET" \
            -d '{}'

name: Build MaxHospital APK

# Qachon ishlaydi:
#  - main ga har push qilinganda
#  - qo'lda: GitHub → Actions → "Build MaxHospital APK" → "Run workflow" (telefondan ham bo'ladi)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "supabase/**"

# Release yaratish va APK ni unga biriktirish uchun.
permissions:
  contents: write

# Ketma-ket push bo'lsa, eskisi to'xtatiladi va faqat oxirgisi yig'iladi.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # v3 eskirgan "tools" paketini so'rab xato berardi; v4 da tuzatilgan.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # "npm ci" emas: package-lock.json da Capacitor paketlari hali yo'q,
      # "npm ci" bunday holatda to'xtaydi. "npm install" lock faylni o'zi to'ldiradi.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build website
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          node scripts/android-setup.mjs
          npx capacitor-assets generate --android
          npx cap sync android

      # Har bir build yangi versiya raqami oladi, shunda telefon uni "yangilanish" deb taniydi.
      - name: Set app version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Imzo kaliti secret sifatida qo'shilgan bo'lsa — imzolangan release APK,
      # bo'lmasa — debug APK (o'rnatish uchun yetarli).
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Imzolangan release APK yig'ilmoqda"
            ./gradlew assembleRelease --no-daemon
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
            "$BUILD_TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "../MaxHospital-${APP_VERSION}.apk" \
              "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "Imzo kaliti yo'q — debug APK yig'ilmoqda"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../MaxHospital-${APP_VERSION}.apk"
          fi
          ls -la ../MaxHospital-*.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: MaxHospital-${{ env.APP_VERSION }}
          path: MaxHospital-*.apk
          if-no-files-found: error
          retention-days: 14

      # Telefondan yuklab olish eng oson joy: GitHub → Releases → eng oxirgi versiya → .apk
      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-v${{ env.APP_VERSION }}
          name: MaxHospital ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MaxHospital-*.apk
          body: |
            Android ilova, versiya ${{ env.APP_VERSION }} (commit ${{ github.sha }}).

            Telefonga o'rnatish: pastdagi `.apk` faylni yuklab oling va oching.
            Telefon "noma'lum manbadan o'rnatish"ga ruxsat so'raydi — ruxsat bering.
